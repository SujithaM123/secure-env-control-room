          fi
          echo "VERSION_LABEL=$VERSION_LABEL" >> "$GITHUB_ENV"

      - name: Build EB environment properties
        run: |
          python3 - "config/prod.env" <<'EOF' > option-settings.json
          import sys, json, os
          settings = []
          with open(sys.argv[1]) as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, _, value = line.partition('=')
                  if key == "APP_VERSION":
