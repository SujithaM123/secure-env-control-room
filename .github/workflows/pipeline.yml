name: CAP-48 Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: secure-env-control-room

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Scan for hardcoded secrets
        run: python scripts/scan_secrets.py

  validate:
    name: Validate
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate dev config
        run: python scripts/validate_config.py dev

      - name: Validate test config
        run: python scripts/validate_config.py test

      - name: Validate prod config
        run: python scripts/validate_config.py prod

  drift:
    name: Drift Check
    needs: validate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compare environment configs
        run: |
          set +e
          python scripts/drift.py | tee drift_output.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning title=Unexpected config drift::drift.py found unexpected differences between environments - see the job log for details"
          fi
          exit "$exit_code"

  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build backend jar
        run: mvn -f backend/pom.xml clean package

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

  deploy-dev:
    name: Deploy Dev
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev (placeholder)
        run: |
          echo "Would inject config/dev.env and deploy image ${{ env.IMAGE_NAME }}:${{ github.sha }} to Dev"
          # TODO: replace with real AWS deploy once Secrets Manager + Elastic Beanstalk are set up

  deploy-test:
    name: Deploy Test
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Test (placeholder)
        run: |
          echo "Would inject config/test.env and deploy image ${{ env.IMAGE_NAME }}:${{ github.sha }} to Test"
          # TODO: replace with real AWS deploy once Secrets Manager + Elastic Beanstalk are set up

  deploy-prod:
    name: Deploy Prod
    needs: deploy-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Prod (placeholder)
        run: |
          echo "Would inject config/prod.env and deploy image ${{ env.IMAGE_NAME }}:${{ github.sha }} to Prod"
          # TODO: replace with real AWS deploy once Secrets Manager + Elastic Beanstalk are set up
