name: CAP-48 Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  IMAGE_NAME: secure-env-control-room
  AWS_REGION: ap-south-1
  DEPLOY_ROLE_ARN: arn:aws:iam::662904411409:role/github-actions-deploy-role
  DEPLOY_BUCKET: secure-env-control-room-sujitha-2026
  EB_APPLICATION_NAME: ecure-env-control-room
  # Pre-deploy audit writes (scan/validate/drift) all go through Test's
  # already-live app - the audit DB is shared, so any instance can record
  # them; which environment a result is about is in the request body, not
  # implied by which instance received it.
  AUDIT_RECORDING_URL: http://cap48-test.eba-3tu8qrdw.ap-south-1.elasticbeanstalk.com

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch write-API key for audit recording
        run: |
          KEY=$(aws secretsmanager get-secret-value --secret-id "test/app/write-api-key" --query SecretString --output text)
          echo "::add-mask::$KEY"
          echo "WRITE_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Scan for hardcoded secrets
        run: python scripts/scan_secrets.py --post-url "${{ env.AUDIT_RECORDING_URL }}" --commit-sha "${{ github.sha }}"

  validate:
    name: Validate
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch write-API key for audit recording
        run: |
          KEY=$(aws secretsmanager get-secret-value --secret-id "test/app/write-api-key" --query SecretString --output text)
          echo "::add-mask::$KEY"
          echo "WRITE_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Validate dev config
        run: python scripts/validate_config.py dev --post-url "${{ env.AUDIT_RECORDING_URL }}" --commit-sha "${{ github.sha }}"

      - name: Validate test config
        run: python scripts/validate_config.py test --post-url "${{ env.AUDIT_RECORDING_URL }}" --commit-sha "${{ github.sha }}"

      - name: Validate prod config
        run: python scripts/validate_config.py prod --post-url "${{ env.AUDIT_RECORDING_URL }}" --commit-sha "${{ github.sha }}"

  drift:
    name: Drift Check
    needs: validate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch write-API key for audit recording
        run: |
          KEY=$(aws secretsmanager get-secret-value --secret-id "test/app/write-api-key" --query SecretString --output text)
          echo "::add-mask::$KEY"
          echo "WRITE_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Compare environment configs
        run: |
          set +e
          python scripts/drift.py --post-url "${{ env.AUDIT_RECORDING_URL }}" --commit-sha "${{ github.sha }}" | tee drift_output.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning title=Unexpected config drift::drift.py found unexpected differences between environments - see the job log for details"
          fi
          exit "$exit_code"

  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy frontend build into backend static resources
        run: |
          rm -rf backend/src/main/resources/static
          mkdir -p backend/src/main/resources/static
          cp -r frontend/dist/. backend/src/main/resources/static/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build backend jar (validation)
        run: mvn -f backend/pom.xml clean package

      - name: Build Docker image (validation)
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

  package:
    name: Package (build once, promote to every environment)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      version_label: ${{ steps.set_version.outputs.version_label }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy frontend build into backend static resources
        run: |
          rm -rf backend/src/main/resources/static
          mkdir -p backend/src/main/resources/static
          cp -r frontend/dist/. backend/src/main/resources/static/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build backend jar (with frontend bundled in)
        run: mvn -f backend/pom.xml clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Elastic Beanstalk application name
        run: |
          app_name=$(aws elasticbeanstalk describe-environments \
            --environment-names "cap48-dev" \
            --query "Environments[0].ApplicationName" \
            --output text)
          if [ -z "$app_name" ] || [ "$app_name" = "None" ]; then
            echo "Could not resolve Elastic Beanstalk application name" >&2
            exit 1
          fi
          echo "EB_APPLICATION_NAME=$app_name" >> "$GITHUB_ENV"

      - name: Create deployment bundle (one artifact, shared by every environment)
        run: zip -r "deploy-${{ github.sha }}.zip" . -x ".git/*"

      - name: Upload bundle to S3
        run: |
          aws s3 cp "deploy-${{ github.sha }}.zip" \
            "s3://${{ env.DEPLOY_BUCKET }}/deploys/${{ github.sha }}.zip"

      - name: Create Elastic Beanstalk application version
        id: set_version
        run: |
          VERSION_LABEL="${{ github.sha }}"
          existing=$(aws elasticbeanstalk describe-application-versions \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-labels "$VERSION_LABEL" \
            --query "length(ApplicationVersions)" --output text)
          if [ "$existing" = "0" ]; then
            aws elasticbeanstalk create-application-version \
              --application-name "${{ env.EB_APPLICATION_NAME }}" \
              --version-label "$VERSION_LABEL" \
              --source-bundle S3Bucket="${{ env.DEPLOY_BUCKET }}",S3Key="deploys/${{ github.sha }}.zip"
          else
            echo "Application version $VERSION_LABEL already exists, reusing it."
          fi
          echo "version_label=$VERSION_LABEL" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy Dev
    needs: package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      EB_ENV_NAME: cap48-dev
      VERIFY_URL: http://cap48-dev.eba-3tu8qrdw.ap-south-1.elasticbeanstalk.com
      VERSION_LABEL: ${{ needs.package.outputs.version_label }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Elastic Beanstalk application name
        run: |
          app_name=$(aws elasticbeanstalk describe-environments \
            --environment-names "${{ env.EB_ENV_NAME }}" \
            --query "Environments[0].ApplicationName" \
            --output text)
          if [ -z "$app_name" ] || [ "$app_name" = "None" ]; then
            echo "Could not resolve Elastic Beanstalk application for environment '${{ env.EB_ENV_NAME }}'" >&2
            exit 1
          fi
          echo "EB_APPLICATION_NAME=$app_name" >> "$GITHUB_ENV"

      - name: Build EB environment properties
        run: |
          python3 - "config/dev.env" <<'EOF' > option-settings.json
          import sys, json, os
          settings = []
          with open(sys.argv[1]) as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, _, value = line.partition('=')
                  if key == "APP_VERSION":
                      value = os.environ.get("GITHUB_SHA", "")[:7]
                  settings.append({
                      "Namespace": "aws:elasticbeanstalk:application:environment",
                      "OptionName": key,
                      "Value": value
                  })
          json.dump(settings, sys.stdout)
          EOF

      - name: Deploy to Dev
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_ENV_NAME }}" \
            --version-label "${{ env.VERSION_LABEL }}" \
            --option-settings file://option-settings.json
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${{ env.EB_ENV_NAME }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Fetch write-API key for audit recording
        run: |
          KEY=$(aws secretsmanager get-secret-value --secret-id "dev/app/write-api-key" --query SecretString --output text)
          echo "::add-mask::$KEY"
          echo "WRITE_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Verify Dev deployment
        run: python scripts/verify.py "${{ env.VERIFY_URL }}" dev --version "${{ env.VERSION_LABEL }}"

      - name: Record config snapshot
        continue-on-error: true
        run: python scripts/post_config_snapshot.py dev "${{ env.VERIFY_URL }}"

  deploy-test:
    name: Deploy Test
    needs: [deploy-dev, package]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      EB_ENV_NAME: cap48-test
      VERIFY_URL: http://cap48-test.eba-3tu8qrdw.ap-south-1.elasticbeanstalk.com
      VERSION_LABEL: ${{ needs.package.outputs.version_label }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Elastic Beanstalk application name
        run: |
          app_name=$(aws elasticbeanstalk describe-environments \
            --environment-names "${{ env.EB_ENV_NAME }}" \
            --query "Environments[0].ApplicationName" \
            --output text)
          if [ -z "$app_name" ] || [ "$app_name" = "None" ]; then
            echo "Could not resolve Elastic Beanstalk application for environment '${{ env.EB_ENV_NAME }}'" >&2
            exit 1
          fi
          echo "EB_APPLICATION_NAME=$app_name" >> "$GITHUB_ENV"

      - name: Build EB environment properties
        run: |
          python3 - "config/test.env" <<'EOF' > option-settings.json
          import sys, json, os
          settings = []
          with open(sys.argv[1]) as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, _, value = line.partition('=')
                  if key == "APP_VERSION":
                      value = os.environ.get("GITHUB_SHA", "")[:7]
                  settings.append({
                      "Namespace": "aws:elasticbeanstalk:application:environment",
                      "OptionName": key,
                      "Value": value
                  })
          json.dump(settings, sys.stdout)
          EOF

      - name: Deploy to Test
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_ENV_NAME }}" \
            --version-label "${{ env.VERSION_LABEL }}" \
            --option-settings file://option-settings.json
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${{ env.EB_ENV_NAME }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Fetch write-API key for audit recording
        run: |
          KEY=$(aws secretsmanager get-secret-value --secret-id "test/app/write-api-key" --query SecretString --output text)
          echo "::add-mask::$KEY"
          echo "WRITE_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Verify Test deployment
        run: python scripts/verify.py "${{ env.VERIFY_URL }}" test --version "${{ env.VERSION_LABEL }}"

      - name: Record config snapshot
        continue-on-error: true
        run: python scripts/post_config_snapshot.py test "${{ env.VERIFY_URL }}"

  deploy-prod:
    name: Deploy Prod
    needs: [deploy-test, package]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      EB_ENV_NAME: cap48-prod
      VERIFY_URL: http://cap48-prod.eba-3tu8qrdw.ap-south-1.elasticbeanstalk.com
      VERSION_LABEL: ${{ needs.package.outputs.version_label }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Elastic Beanstalk application name
        run: |
          app_name=$(aws elasticbeanstalk describe-environments \
            --environment-names "${{ env.EB_ENV_NAME }}" \
            --query "Environments[0].ApplicationName" \
            --output text)
          if [ -z "$app_name" ] || [ "$app_name" = "None" ]; then
            echo "Could not resolve Elastic Beanstalk application for environment '${{ env.EB_ENV_NAME }}'" >&2
            exit 1
          fi
          echo "EB_APPLICATION_NAME=$app_name" >> "$GITHUB_ENV"

      - name: Build EB environment properties
        run: |
          python3 - "config/prod.env" <<'EOF' > option-settings.json
          import sys, json, os
          settings = []
          with open(sys.argv[1]) as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, _, value = line.partition('=')
                  if key == "APP_VERSION":
                      value = os.environ.get("GITHUB_SHA", "")[:7]
                  settings.append({
                      "Namespace": "aws:elasticbeanstalk:application:environment",
                      "OptionName": key,
                      "Value": value
                  })
          json.dump(settings, sys.stdout)
          EOF

      - name: Deploy to Prod
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_ENV_NAME }}" \
            --version-label "${{ env.VERSION_LABEL }}" \
            --option-settings file://option-settings.json
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${{ env.EB_ENV_NAME }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Fetch write-API key for audit recording
        run: |
          KEY=$(aws secretsmanager get-secret-value --secret-id "prod/app/write-api-key" --query SecretString --output text)
          echo "::add-mask::$KEY"
          echo "WRITE_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Verify Prod deployment
        run: python scripts/verify.py "${{ env.VERIFY_URL }}" prod --version "${{ env.VERSION_LABEL }}"

      - name: Record config snapshot
        continue-on-error: true
        run: python scripts/post_config_snapshot.py prod "${{ env.VERIFY_URL }}"

  final-leak-check:
    name: Final Leak Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan full git history for leaked secrets
        run: |
          MATCHES=$(git log --all -p | grep -ciE "AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|password[[:space:]]*=[[:space:]]*['\"][^'\"]{4,}['\"]" || true)
          echo "Match count: $MATCHES"
          if [ "$MATCHES" -gt 0 ]; then
            echo "::error::Potential secret(s) found somewhere in git history. Do not print details here — clone locally to investigate."
            exit 1
          else
            echo "Clean — no secret-like patterns found anywhere in full git history."
          fi
