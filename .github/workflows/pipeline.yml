name: CAP-48 Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: secure-env-control-room
  AWS_REGION: ap-south-1
  DEPLOY_ROLE_ARN: arn:aws:iam::662904411409:role/github-actions-deploy-role
  DEPLOY_BUCKET: secure-env-control-room-sujitha-2026
  EB_APPLICATION_NAME: ecure-env-control-room

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Scan for hardcoded secrets
        run: python scripts/scan_secrets.py

  validate:
    name: Validate
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate dev config
        run: python scripts/validate_config.py dev

      - name: Validate test config
        run: python scripts/validate_config.py test

      - name: Validate prod config
        run: python scripts/validate_config.py prod

  drift:
    name: Drift Check
    needs: validate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compare environment configs
        run: |
          set +e
          python scripts/drift.py | tee drift_output.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning title=Unexpected config drift::drift.py found unexpected differences between environments - see the job log for details"
          fi
          exit "$exit_code"

  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build backend jar
        run: mvn -f backend/pom.xml clean package

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

  deploy-dev:
    name: Deploy Dev
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      EB_ENV_NAME: cap48-dev
      VERIFY_URL: http://cap48-dev.eba-3tu8qrdw.ap-south-1.elasticbeanstalk.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build backend jar
        run: mvn -f backend/pom.xml clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Elastic Beanstalk application name
        run: |
          app_name=$(aws elasticbeanstalk describe-environments \
            --environment-names "${{ env.EB_ENV_NAME }}" \
            --query "Environments[0].ApplicationName" \
            --output text)
          if [ -z "$app_name" ] || [ "$app_name" = "None" ]; then
            echo "Could not resolve Elastic Beanstalk application for environment '${{ env.EB_ENV_NAME }}'" >&2
            exit 1
          fi
          echo "EB_APPLICATION_NAME=$app_name" >> "$GITHUB_ENV"

      - name: Create deployment bundle
        run: zip -r "deploy-${{ github.sha }}.zip" . -x ".git/*"

      - name: Upload bundle to S3
        run: |
          aws s3 cp "deploy-${{ github.sha }}.zip" \
            "s3://${{ env.DEPLOY_BUCKET }}/deploys/dev/${{ github.sha }}.zip"

      - name: Create Elastic Beanstalk application version
        run: |
          VERSION_LABEL="${{ github.sha }}-dev"
          existing=$(aws elasticbeanstalk describe-application-versions \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-labels "$VERSION_LABEL" \
            --query "length(ApplicationVersions)" --output text)
          if [ "$existing" = "0" ]; then
            aws elasticbeanstalk create-application-version \
              --application-name "${{ env.EB_APPLICATION_NAME }}" \
              --version-label "$VERSION_LABEL" \
              --source-bundle S3Bucket="${{ env.DEPLOY_BUCKET }}",S3Key="deploys/dev/${{ github.sha }}.zip"
          else
            echo "Application version $VERSION_LABEL already exists, reusing it."
          fi
          echo "VERSION_LABEL=$VERSION_LABEL" >> "$GITHUB_ENV"

      - name: Build EB environment properties
        run: |
          python3 - "config/dev.env" <<'EOF' > option-settings.json
          import sys, json, os
          settings = []
          with open(sys.argv[1]) as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, _, value = line.partition('=')
                  if key == "APP_VERSION":
                      value = os.environ.get("GITHUB_SHA", "")[:7]
                  settings.append({
                      "Namespace": "aws:elasticbeanstalk:application:environment",
                      "OptionName": key,
                      "Value": value
                  })
          json.dump(settings, sys.stdout)
          EOF

      - name: Deploy to Dev
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_ENV_NAME }}" \
            --version-label "${{ env.VERSION_LABEL }}" \
            --option-settings file://option-settings.json
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${{ env.EB_ENV_NAME }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify Dev deployment
        run: python scripts/verify.py "${{ env.VERIFY_URL }}" dev

  deploy-test:
    name: Deploy Test
    needs: deploy-dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      EB_ENV_NAME: cap48-test
      VERIFY_URL: http://cap48-test.eba-3tu8qrdw.ap-south-1.elasticbeanstalk.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build backend jar
        run: mvn -f backend/pom.xml clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Elastic Beanstalk application name
        run: |
          app_name=$(aws elasticbeanstalk describe-environments \
            --environment-names "${{ env.EB_ENV_NAME }}" \
            --query "Environments[0].ApplicationName" \
            --output text)
          if [ -z "$app_name" ] || [ "$app_name" = "None" ]; then
            echo "Could not resolve Elastic Beanstalk application for environment '${{ env.EB_ENV_NAME }}'" >&2
            exit 1
          fi
          echo "EB_APPLICATION_NAME=$app_name" >> "$GITHUB_ENV"

      - name: Create deployment bundle
        run: zip -r "deploy-${{ github.sha }}.zip" . -x ".git/*"

      - name: Upload bundle to S3
        run: |
          aws s3 cp "deploy-${{ github.sha }}.zip" \
            "s3://${{ env.DEPLOY_BUCKET }}/deploys/test/${{ github.sha }}.zip"

      - name: Create Elastic Beanstalk application version
        run: |
          VERSION_LABEL="${{ github.sha }}-test"
          existing=$(aws elasticbeanstalk describe-application-versions \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-labels "$VERSION_LABEL" \
            --query "length(ApplicationVersions)" --output text)
          if [ "$existing" = "0" ]; then
            aws elasticbeanstalk create-application-version \
              --application-name "${{ env.EB_APPLICATION_NAME }}" \
              --version-label "$VERSION_LABEL" \
              --source-bundle S3Bucket="${{ env.DEPLOY_BUCKET }}",S3Key="deploys/test/${{ github.sha }}.zip"
          else
            echo "Application version $VERSION_LABEL already exists, reusing it."
          fi
          echo "VERSION_LABEL=$VERSION_LABEL" >> "$GITHUB_ENV"

      - name: Build EB environment properties
        run: |
          python3 - "config/test.env" <<'EOF' > option-settings.json
          import sys, json, os
          settings = []
          with open(sys.argv[1]) as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, _, value = line.partition('=')
                  if key == "APP_VERSION":
                      value = os.environ.get("GITHUB_SHA", "")[:7]
                  settings.append({
                      "Namespace": "aws:elasticbeanstalk:application:environment",
                      "OptionName": key,
                      "Value": value
                  })
          json.dump(settings, sys.stdout)
          EOF

      - name: Deploy to Test
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_ENV_NAME }}" \
            --version-label "${{ env.VERSION_LABEL }}" \
            --option-settings file://option-settings.json
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${{ env.EB_ENV_NAME }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify Test deployment
        run: python scripts/verify.py "${{ env.VERIFY_URL }}" test

  deploy-prod:
    name: Deploy Prod
    needs: deploy-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      EB_ENV_NAME: cap48-prod
      VERIFY_URL: http://cap48-prod.eba-3tu8qrdw.ap-south-1.elasticbeanstalk.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build backend jar
        run: mvn -f backend/pom.xml clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Elastic Beanstalk application name
        run: |
          app_name=$(aws elasticbeanstalk describe-environments \
            --environment-names "${{ env.EB_ENV_NAME }}" \
            --query "Environments[0].ApplicationName" \
            --output text)
          if [ -z "$app_name" ] || [ "$app_name" = "None" ]; then
            echo "Could not resolve Elastic Beanstalk application for environment '${{ env.EB_ENV_NAME }}'" >&2
            exit 1
          fi
          echo "EB_APPLICATION_NAME=$app_name" >> "$GITHUB_ENV"

      - name: Create deployment bundle
        run: zip -r "deploy-${{ github.sha }}.zip" . -x ".git/*"

      - name: Upload bundle to S3
        run: |
          aws s3 cp "deploy-${{ github.sha }}.zip" \
            "s3://${{ env.DEPLOY_BUCKET }}/deploys/prod/${{ github.sha }}.zip"

      - name: Create Elastic Beanstalk application version
        run: |
          VERSION_LABEL="${{ github.sha }}-prod"
          existing=$(aws elasticbeanstalk describe-application-versions \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-labels "$VERSION_LABEL" \
            --query "length(ApplicationVersions)" --output text)
          if [ "$existing" = "0" ]; then
            aws elasticbeanstalk create-application-version \
              --application-name "${{ env.EB_APPLICATION_NAME }}" \
              --version-label "$VERSION_LABEL" \
              --source-bundle S3Bucket="${{ env.DEPLOY_BUCKET }}",S3Key="deploys/prod/${{ github.sha }}.zip"
          else
